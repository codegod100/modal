[container]
name        = "hello"
description = "A devShell app: prints where each of its nix tools resolved."
base        = "arch-nix"

[build]
include = ["."]

[resources]
timeout = 900

[run]
workdir = "/app"
command = "python3 hello.py"
env     = { HELLO_WHO = "a fresh Modal container" }

[nix]
flake = true
shim  = true
