[container]
name        = "sandbox-hello"
description = "The hello devShell, in a Sandbox on a real VM instead of gVisor."
base        = "arch-nix"
# A Sandbox rather than a Function: it can run on a real VM, you can drop into
# it with `scripts/shell sandbox-hello`, and nothing of yours is imported into
# it. vm_runtime defaults on for sandboxes -- see ../../README.md.
runtime     = "sandbox"

[build]
include = ["."]

[resources]
timeout = 900
# A VM sandbox gets exactly this and cannot burst into more.
memory  = 2048

[run]
workdir = "/app"
command = "python3 hello.py"
env     = { HELLO_WHO = "a Sandbox on a real VM" }

[nix]
# shim is still required: the image BUILD runs under gVisor even though the
# sandbox itself does not, and warming the devShell is a build step.
flake = true
shim  = true
