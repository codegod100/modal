[project]
name = "modal-mcp"
version = "0.1.0"
description = "MCP server exposing Modal.com management tools, deployable to Modal itself"
requires-python = ">=3.10"
dependencies = [
    "modal~=1.5",
    "fastmcp~=4.0",
]

[project.scripts]
modal-mcp = "modal_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["modal_mcp"]
